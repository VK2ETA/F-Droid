name: Update F-Droid Repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Build F-Droid Index
        uses: efreak/fdroid-action@main
        with:
          allow_unverified_apks: true
          apps: |
            vk2eta/RadioMsg
            vk2eta/quik-RadioMsg

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'        # or './repo' depending on where fdroid-action outputs files

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

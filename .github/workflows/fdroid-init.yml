name: Generate F-Droid Key (Run Once)

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Generate keystore
        run: |
          mkdir fdroid && cd fdroid
          fdroid init
          echo "=== KEYSTORE_B64 (copy this for FDROID_KEYSTORE secret) ==="
          base64 keystore.p12 | tr -d '\n'
          echo ""
          echo "=== CONFIG (find keystorepass value for FDROID_KEYSTORE_PASS secret) ==="
          cat config.yml

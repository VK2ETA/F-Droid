name: Generate F-Droid Key (Run Once)

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore with keytool
        run: |
          keytool -genkey -v \
            -keystore keystore.p12 \
            -storetype pkcs12 \
            -alias fdroid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fdroidpass123 \
            -keypass fdroidpass123 \
            -dname "CN=vk2eta, OU=FDroid, O=vk2eta, L=Unknown, S=Unknown, C=AU"

          echo "=== KEYSTORE_B64 (save as FDROID_KEYSTORE secret) ==="
          base64 keystore.p12 | tr -d '\n'
          echo ""
          echo "=== Password (save as FDROID_KEYSTORE_PASS secret) ==="
          echo "fdroidpass123"
